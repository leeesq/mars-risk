[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-risk"      
version = "0.0.15"       
description = "High-performance Risk Modeling Toolkit powered by Polars"
readme = "README.md"
requires-python = ">=3.10" 
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
]
license = {file = "LICENSE"}
keywords = ["risk", "scorecard", "polars", "credit-scoring", "feature-binning", "modeling", "machine-learning"]
authors = [
  {name = "christian", email = "lee_sq001@163.com"}
]

dependencies = [
    "polars>=1.33.1",     
    "numpy>=1.24.0",      
    "pandas>=2.0.0",     
    "pyarrow>=14.0.0",    

    "scikit-learn>=1.7.2", 
    "scipy>=1.10.0",       
    "optbinning>=0.19.0",  
    
    "joblib>=1.3.0",       
    "colorlog>=6.7.0",  
    "tqdm>=4.66.0",
    "ipython>=8.0.0",
]

# 安装命令: pip install -e ".[dev]"
[project.optional-dependencies]

excel = [
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "xlwings>=0.30.0"
]

plot = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

notebook = [
    "jupyterlab>=4.0.0"
]

# 机器学习模型支持
ml = [
    "xgboost>=3.0.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.9"
]

tuning = [
    "optuna>=4.0.0",
    "optuna-integration>=4.0.0"
]

# 开发与测试环境
dev = [
    "pytest>=7.4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=23.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "xlwings>=0.30.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",   
    "seaborn>=0.12.0",
    "tqdm>=4.66.0",        
    "psutil>=5.9.0"        
]

# 自动发现包配置
[tool.setuptools.packages.find]
where = ["src"]
include = ["mars*"]  
[tool.setuptools.package-data]
"mars" = ["py.typed"]
"mars.analysis" = ["*.xlsx"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # The codebase still contains HTML/CSS/JS templates and generated report strings.
    # Keep line-length visible in editor tooling, but do not block CI on E501 yet.
    "E501",
    # Gradual Python 3.10 typing migration: touched files should use native syntax,
    # but the historical baseline still contains typing.List/Dict/Optional/Union.
    "UP006",
    "UP007",
    "UP035",
]

[tool.ruff.lint.isort]
known-first-party = ["mars"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/mars"]
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
ignore_missing_imports = true
allow_redefinition = true
show_error_codes = true
pretty = true
exclude = [
    "^examples/",
    "^tutorial/",
]

[[tool.mypy.overrides]]
module = [
    "catboost.*",
    "lightgbm.*",
    "matplotlib.*",
    "optbinning.*",
    "optuna.*",
    "seaborn.*",
    "sklearn.*",
    "xgboost.*",
    "xlwings.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mars.analysis.evaluator",
    "mars.analysis.profiler",
    "mars.analysis.report",
    "mars.core.base",
    "mars.feature.binner",
    "mars.feature.selector",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "has-type",
    "index",
    "misc",
    "no-any-return",
    "override",
    "return-value",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = [
    "mars.modeling.*",
    "mars.scoring.scorecard",
]
disable_error_code = [
    "no-any-return",
    "union-attr",
    "var-annotated",
]
