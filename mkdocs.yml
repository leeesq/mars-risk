site_name: MARS
site_description: 面向信贷风控分析与建模的 Polars-first Python 工具库
site_url: https://leeesq.github.io/mars-risk/
repo_url: https://github.com/leeesq/mars-risk
repo_name: leeesq/mars-risk
copyright: Copyright &copy; 2026 Christian Li and Tina

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  logo: assets/mars-logo.svg
  favicon: assets/mars-logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 开始使用:
      - 安装: getting-started/installation.md
      - 10 分钟 Quickstart: getting-started/quickstart.md
      - 核心 API 约定: getting-started/api-conventions.md
  - 使用指南:
      - 数据画像: user-guide/data-profiling.md
      - 分箱与风险评估: user-guide/binning-risk-evaluation.md
      - 特征筛选: user-guide/feature-selection.md
      - Modeling / Pipeline: user-guide/modeling-pipeline.md
      - 特征与模型监控: user-guide/monitoring.md
      - 报告与评分卡: user-guide/reports-and-exports.md
  - 核心概念:
      - 数据角色与运行边界: concepts/data-and-runs.md
      - Report 与 Artifact: concepts/reports-and-artifacts.md
  - API Reference:
      - 总览: reference/index.md
      - Analysis: reference/analysis.md
      - Feature: reference/feature.md
      - Monitoring: reference/monitoring.md
      - Modeling / Pipeline: reference/modeling.md
      - Scoring: reference/scoring.md
      - Reporting: reference/reporting.md
      - Report 对象: reference/report-objects.md
  - 示例:
      - LightGBM 建模与监控: demos/lgb-modeling-monitoring.ipynb
  - 项目:
      - 稳定性与兼容性: project/stability.md
      - Release Notes: project/release-notes.md
      - 性能基准: performance/benchmark.md
      - FAQ: faq.md
      - 贡献文档: project/contributing.md
