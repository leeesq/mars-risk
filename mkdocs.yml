site_name: MARS
site_description: 面向人和 AI Agent 的风控分析工具箱
site_url: https://leeesq.github.io/mars-risk/
repo_url: https://github.com/leeesq/mars-risk
repo_name: leeesq/mars-risk
copyright: Copyright &copy; 2026 Christian Li and Tina

theme:
  name: material
  language: zh
  font: false
  custom_dir: docs/overrides
  logo: assets/mars-logo.svg
  favicon: assets/mars-logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 开始使用:
      - 安装: getting-started/installation.md
      - 10 分钟 Quickstart: getting-started/quickstart.md
      - 核心 API 约定: getting-started/api-conventions.md
  - 分析与筛选:
      - 数据画像: user-guide/data-profiling.md
      - 分箱与风险评估: user-guide/binning-risk-evaluation.md
      - 特征筛选: user-guide/feature-selection.md
      - 相关性与模型分交叉: user-guide/correlation-and-score-cross.md
      - 规则挖掘（Experimental）: user-guide/rule-mining.md
      - 规则报告与外部 Agent: user-guide/rule-reports-and-agents.md
      - 数据角色与运行边界: concepts/data-and-runs.md
  - 报告与 AI:
      - 报告查询与导出: user-guide/reports-and-exports.md
      - 外部 Agent、保存恢复与业务元数据: user-guide/external-agents.md
      - 可选内置 Agent（Experimental）: user-guide/agent.md
      - Report 与 Artifact: concepts/reports-and-artifacts.md
  - 其他模块（暂停迭代）:
      - 建模／Pipeline: user-guide/modeling-pipeline.md
      - 监控: user-guide/monitoring.md
      - 评分卡: user-guide/scorecard.md
  - API Reference:
      - 总览: reference/index.md
      - Analysis: reference/analysis.md
      - Feature: reference/feature.md
      - Rule: reference/rule.md
      - Monitoring: reference/monitoring.md
      - Agent: reference/agent.md
      - Modeling / Pipeline: reference/modeling.md
      - Scoring: reference/scoring.md
      - Reporting: reference/reporting.md
      - Report 对象: reference/report-objects.md
  - 示例:
      - 模型分交叉与保存后回放: demos/correlation_and_score_cross.ipynb
      - LightGBM 建模与监控: demos/lgb-modeling-monitoring.ipynb
  - 项目:
      - 稳定性与兼容性: project/stability.md
      - Release Notes: project/release-notes.md
      - 计算、报告与展示验收: project/validation-20261002.md
      - 规则模块来源: project/rule-origin.md
      - Deimos 迁移矩阵: project/deimos-rule-migration.md
      - 性能基准: performance/benchmark.md
      - 核心规模与报告消费验收: performance/core-capacity.md
      - 相关性与交叉报告验证: performance/correlation-score-cross.md
      - FAQ: faq.md
      - 贡献文档: project/contributing.md
