name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to build and deploy from
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,tuning,docs]"
      - name: Check package version
        if: inputs.release_tag == ''
        run: python scripts/check_release_version.py
      - name: Check released package version
        if: inputs.release_tag != ''
        run: python scripts/check_release_version.py --release-tag "${{ inputs.release_tag }}"
      - name: Check documentation code style
        run: python -m ruff check tests/test_documentation.py scripts/check_release_version.py docs/snippets
      - name: Run documentation tests
        run: python -m pytest -q tests/test_documentation.py --basetemp .pytest-tmp-docs
      - name: Build documentation
        run: python -m mkdocs build --strict

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout documentation source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,tuning,docs]"
      - name: Build documentation artifact
        run: python -m mkdocs build --strict
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
