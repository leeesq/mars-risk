name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,tuning,docs]"
      - name: Check package version
        run: python scripts/check_release_version.py
      - name: Check documentation code style
        run: python -m ruff check tests/test_documentation.py scripts/check_release_version.py docs/snippets
      - name: Run documentation tests
        run: python -m pytest -q tests/test_documentation.py --basetemp .pytest-tmp-docs
      - name: Build documentation
        run: python -m mkdocs build --strict
