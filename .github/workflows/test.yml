name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run static checks against the Python 3.8 syntax target
      run: |
        python -m ruff check src tests scripts
        python -m mypy src/mars
        pydoclint src/mars
        python scripts/check_private_docstrings.py src/mars

  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run default-dependency test suite
      run: python -m pytest -q -m "not docs_ml and not optional_ml"

  legacy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python 3.8 frozen stack
      if: matrix.python-version == '3.8'
      run: |
        python -m pip install --upgrade "pip<25"
        python -m pip install -c constraints/python38.txt -e . pytest
    - name: Install Python 3.9 dependency-boundary stack
      if: matrix.python-version == '3.9'
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . pytest
    - name: Verify package imports
      run: |
        python -m compileall -q src/mars
        python -c "import mars; print(mars.__version__)"
    - name: Run base public-API test suite
      run: python -m pytest -q -m "not docs_ml and not optional_ml"

  modeling:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ml,tuning]"
    - name: Run modeling test suite
      run: |
        python -m pytest -q tests/test_modeling_slicer.py tests/test_modeling_tuner.py tests/test_modeling_evaluator.py tests/test_modeling_testbench.py tests/test_modeling_pipeline.py tests/test_pipeline.py tests/test_selector.py

  distribution:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build wheel and sdist once
      run: |
        python -m pip install --upgrade pip
        python -m pip install build packaging twine
        python scripts/check_release_version.py
        python -m build
    - name: Verify distribution metadata and resources
      run: |
        python scripts/verify_distribution.py --dist-dir dist
        python -m twine check dist/*
    - name: Upload verified build candidates
      uses: actions/upload-artifact@v4
      with:
        name: mars-distributions
        path: dist/*
        if-no-files-found: error

  installed-wheel-smoke:
    name: Installed wheel smoke (Python ${{ matrix.python-version }})
    needs: distribution
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Download the single built artifact
      uses: actions/download-artifact@v4
      with:
        name: mars-distributions
        path: dist
    - name: Create isolated environment
      id: venv
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/mars-wheel-smoke"
        echo "python=$RUNNER_TEMP/mars-wheel-smoke/bin/python" >> "$GITHUB_OUTPUT"
    - name: Install wheel with Python 3.8 frozen constraints
      if: matrix.python-version == '3.8'
      shell: bash
      run: |
        "${{ steps.venv.outputs.python }}" -m pip install --upgrade "pip<25"
        "${{ steps.venv.outputs.python }}" -m pip install -c constraints/python38.txt dist/*.whl
    - name: Install wheel with modern dependencies
      if: matrix.python-version == '3.12'
      shell: bash
      run: |
        "${{ steps.venv.outputs.python }}" -m pip install --upgrade pip
        "${{ steps.venv.outputs.python }}" -m pip install dist/*.whl
    - name: Run installed-wheel smoke outside the repository
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        "${{ steps.venv.outputs.python }}" "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py" --repo-root "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/mars-smoke-output"
        "${{ steps.venv.outputs.python }}" -m pip check
