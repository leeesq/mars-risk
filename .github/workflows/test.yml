name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run static checks
      run: |
        python -m ruff check src tests scripts
        python -m mypy src/mars
        pydoclint src/mars
        python scripts/check_private_docstrings.py src/mars
    - name: Run test suite
      run: |
        python -m pytest -q tests/test_binner.py tests/test_selector.py tests/test_evaluator.py tests/test_profiler.py tests/test_scoring.py

  modeling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ml,tuning]"
    - name: Run static checks
      run: |
        python -m ruff check src tests scripts
        python -m mypy src/mars
        pydoclint src/mars
        python scripts/check_private_docstrings.py src/mars
    - name: Run modeling test suite
      run: |
        python -m pytest -q tests/test_modeling_slicer.py tests/test_modeling_tuner.py tests/test_modeling_evaluator.py tests/test_modeling_testbench.py tests/test_modeling_pipeline.py
